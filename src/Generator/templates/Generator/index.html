{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#007bff',
                        secondary: '#6c757d',
                    },
                    fontFamily: { 
                        sans: ['Inter', 'ui-sans-serif', 'system-ui'] 
                    }
                }
            }
        }
    </script>

    <!-- Open graph -->
     <meta property="og:title" content="Générateur de QR Code" />
    <meta property="og:description" content="Créez des codes QR instantanément et gratuitement sans limite." />
    <meta property="og:image" content="https://qrcode.mouhatech.com/static/Generator/images/qr_code.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://qrcode.mouhatech.com/" />
    <meta property="og:site_name" content="Générateur de QR Code" />

    <link rel="icon" type="image/png" href="{% static 'Generator/images/qr_code.png' %}">
    <link rel="stylesheet" href=" {% static 'Generator/css/style.css' %}">
    <title>Générateur de QR Code</title>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-8 fade-in">
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-2 drop-shadow-lg">
                Générateur de QR Code
            </h1>
            <p class="text-white/90 text-lg">Créez des codes QR instantanément et gratuitement</p>
        </div>

        <!-- carte principale -->
        <div class="glass-effect rounded-2xl p-6 md:p-8 shadow-2xl fade-in">
            <form method="post" id="qrForm" class="space-y-6">
                {% csrf_token %}
                <!-- Input Section -->
                <div class="space-y-4">
                    <label for="lien" class="block text-gray-700 font-semibold text-lg">
                        Entrez votre lien ou votre texte
                    </label>
                    <div class="relative">
                        <input type="text" id="lien" name="lien" placeholder="https://example.com ou votre texte ici..." class="w-full px-4 py-3 pr-12 border-2 border-gray-300 rounded-xl input-focus transition-all duration-300 text-gray-700 placeholder-gray-400" required>
                        <svg class="absolute right-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                        </svg>
                    </div>
                </div>

                <!-- bouton generate -->
                <button type="submit" class="w-full py-3 px-6 rounded-xl text-white font-semibold text-lg shadow-lg" style="background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);">
                    <span class="flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        Générer le QR Code
                    </span>
                </button>
            </form>

            <!-- Section QR Code -->
            <div id="qrContainer" class="mt-8 qr-container">
                <div class="bg-gray-50 rounded-xl p-6 border-2 border-gray-200">
                    <h2 class="text-xl font-semibold text-gray-700 mb-4 text-center">Votre QR Code</h2>
                    <div class="flex flex-col items-center space-y-4">
                        <div id="qrcode" class="p-4 rounded-lg shadow-md bg-gradient-to-br from-[#764ba2] to-[#667eea] max-w-xs mx-auto">
                            {% if qr_code %}
                            <img src="{{ qr_code.url }}" id="qrcode" alt="QR Code" class="w-full h-auto object-contain">
                            {% endif %}
                        </div>
                        {% if qr_code %}
                        <div class="flex gap-3 flex-wrap justify-center">
                            <button id="downloadBtn" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors font-medium flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                </svg>
                                Télécharger
                            </button>
                            <button id="resetBtn" class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors font-medium flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                </svg>
                                Réinitialiser
                            </button>
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-white/80 text-sm">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <p>Générateur de QR Code gratuit et sans limite</p>
                <p>Developpé par <a href="https://mouhatech.com" target="_blank"><span class="text-white font-bold">MouhaTech</span></a></p>
            </div>
        </div>
    </div>


    <script>
        const qrcode = document.getElementById('qrcode');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const form = document.getElementById('qrForm');


        downloadBtn.addEventListener('click', function() {
            const qrCodeImage = qrcode.querySelector('img');
            if (qrCodeImage) {
                const link = document.createElement('a');
                link.href = qrCodeImage.src;
                link.download = 'qr_code.png';
                link.click();
            }
        });

        resetBtn.addEventListener('click', function() {
            qrcode.innerHTML = '';
            downloadBtn.style.display = 'none';
            resetBtn.style.display = 'none';
            
            window.history.replaceState({}, document.title, window.location.pathname);
        });
    </script>
</body>
</html>
